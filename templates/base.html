<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}English Quest{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/avatar.js') }}"></script>
  <script>window.CUSTOM_SCENES = {{ (CUSTOM_SCENES or {})|tojson }};</script>
  <script src="{{ url_for('static', filename='js/scenes.js') }}"></script>
  <script src="{{ url_for('static', filename='js/tour.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
