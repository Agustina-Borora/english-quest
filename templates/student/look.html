{% extends "base.html" %}
{% block title %}Mi look · English Quest{% endblock %}
{% block body_class %}kid{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/kid.css') }}">{% endblock %}
{% block content %}
<div class="wrap">
  <div class="topbar">
    <a href="{{ url_for('student.home') }}">⬅ Volver</a>
    <span class="brand-small">⭐ English Quest</span>
    <span></span>
  </div>
  <h1 class="screen-title">👕 Cambiá tu look</h1>
  <div class="look">
    <div class="stage">
      <div class="big" id="preview"></div>
      <p style="font-weight:700;font-size:1.3rem;margin:10px 0">{{ s.name }}</p>
      <div class="center-actions" style="margin-top:6px">
        <button class="btn light" id="btn-random">🎲 Al azar</button>
        <button class="btn green big" id="btn-save">💾 Guardar</button>
      </div>
    </div>
    <div class="card" id="options"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let A = {{ s.avatar_data|tojson }};
const O = AVATAR_OPTIONS;
const groups = [
  { key: "skin", title: "🖐 Color de piel", colors: O.skin },
  { key: "hair", title: "💇 Peinado", names: O.hair, part: "hair" },
  { key: "hairColor", title: "🎨 Color de pelo", colors: O.hairColor },
  { key: "eyes", title: "👀 Ojos", names: O.eyes, part: "eyes" },
  { key: "top", title: "👕 Ropa", names: O.top, part: "top" },
  { key: "topColor", title: "🌈 Color de la ropa", colors: O.topColor },
  { key: "pants", title: "👖 Color del pantalón", colors: O.pantsColor },
  { key: "accessory", title: "🧢 Accesorio", names: O.accessory, part: "acc" },
];
function render() {
  $("#preview").innerHTML = avatarSVG(A);
  $("#options").innerHTML = groups.map(g => `
    <div class="opt-group"><h3>${g.title}</h3><div class="opt-row">
      ${g.colors
        ? g.colors.map((c, i) => `<button class="sw ${A[g.key] === i ? "on" : ""}" style="background:${c}" data-k="${g.key}" data-v="${i}" title="${c}"></button>`).join("")
        : g.names.map((n, i) => `<button class="thumb-opt ${A[g.key] === i ? "on" : ""}" data-k="${g.key}" data-v="${i}" title="${n}">${avatarSVG({ ...A, [g.key]: i }, { bust: g.key !== "top" })}</button>`).join("")}
    </div></div>`).join("");
  $$("#options [data-k]").forEach(b => b.onclick = () => { A[b.dataset.k] = +b.dataset.v; beep("pop"); render(); });
}
render();
$("#btn-random").onclick = () => {
  A = { skin: rnd(O.skin), hair: rnd(O.hair), hairColor: rnd(O.hairColor), eyes: rnd(O.eyes), top: rnd(O.top),
        topColor: rnd(O.topColor), pants: rnd(O.pantsColor), accessory: rnd(O.accessory) };
  render();
};
function rnd(list) { return Math.floor(Math.random() * list.length); }
$("#btn-save").onclick = async () => {
  try {
    await postJSON("{{ url_for('student.look') }}", A);
    confetti(60); beep("good"); toast("¡Look guardado! 😎");
    setTimeout(() => location.href = "{{ url_for('student.home') }}", 1200);
  } catch (e) { toast(e.message); }
};
</script>
{% endblock %}
